name: ci

on:
  push:
  pull_request:

jobs:
  linux-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup
      - run: make test
      - run: make style
      - run: make eval
# Future: device jobs (make test-device, make bench-device) need an attached
# device/emulator + Android SDK — not in this JVM-only gate.
