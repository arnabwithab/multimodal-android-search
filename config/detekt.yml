# detekt overrides for multimodal-search-for-android (applied on top of the
# default ruleset via buildUponDefaultConfig in app/build.gradle.kts).

style:
  MaxLineLength:
    active: true
    maxLineLength: 140 # single source of truth: matches ktlint's 140 so both linters agree.

complexity:
  TooManyFunctions:
    # IndexStore is a thin DAO and DocChunks.kt holds chunking helpers — both
    # legitimately exceed the default threshold (11), so only those two units
    # are excluded. The rule stays on everywhere else.
    active: true
    excludes: ['**/IndexStore.kt', '**/DocChunks.kt', '**/*Test.kt']
